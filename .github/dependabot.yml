version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "build(deps)"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      ktor:
        patterns:
          - "io.ktor*"
      kotest:
        patterns:
          - "io.kotest*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Stay on JDK 21 — Tessera, Mosaic and Kotlin Gradle plugin 2.3.21 don't
      # support running on newer LTS JDKs yet. Patch/minor of the 21.x line is
      # fine and will still come through. Major bumps need to be coordinated
      # across the whole NLP-Kotlin ecosystem first.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
