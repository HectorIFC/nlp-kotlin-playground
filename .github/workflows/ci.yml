name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]  # feature branches get CI too

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Individual jobs raise the bar only where needed
# (e.g. `actions: write` for the GHA cache backend used by docker-build).
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ktlint — formatting
        run: ./gradlew ktlintCheck

      - name: detekt — static analysis
        run: ./gradlew detekt

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    # The GHA cache backend used below needs to write to the Actions cache API.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nlp-kotlin-playground:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bring up the full compose stack — v0.1.0's /health only returns 200
      # when SQLite, MinIO and RabbitMQ are all reachable, so a standalone
      # `docker run` of the app container fails its healthcheck by design.
      - name: Boot full compose stack
        run: docker compose up -d --no-build

      - name: Wait for app to become healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "::notice::Healthcheck passed after ${i}s"
              curl -s http://localhost:8080/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::App never returned 200 on /health within 90s"
          echo "--- compose status ---"
          docker compose ps
          echo "--- app logs ---"
          docker compose logs app | tail -100
          echo "--- minio logs ---"
          docker compose logs minio | tail -30
          echo "--- rabbitmq logs ---"
          docker compose logs rabbitmq | tail -30
          exit 1

      - name: Smoke test upload + queue + ready
        run: |
          set -euo pipefail
          # Build a tiny corpus and upload it; the worker should drain it to READY.
          printf 'The fox jumps over the lazy dog.\nThe dog sleeps.\n' > /tmp/smoke.txt
          TID=$(curl -fsS -X POST http://localhost:8080/upload -F "file=@/tmp/smoke.txt" \
                 | python3 -c "import json,sys;print(json.load(sys.stdin)['trainingId'])")
          echo "trainingId=$TID"
          for i in $(seq 1 60); do
            STATE=$(curl -fsS "http://localhost:8080/api/training/$TID" \
                    | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
            echo "[$i] state=$STATE"
            [ "$STATE" = "ready" ] && { echo "::notice::Pipeline ready after ${i}s"; exit 0; }
            [ "$STATE" = "failed" ] && { echo "::error::Training failed"; docker compose logs app | tail -50; exit 1; }
            sleep 1
          done
          echo "::error::Training never reached READY within 60s"
          docker compose logs app | tail -50
          exit 1

      - name: Tear down compose
        if: always()
        run: docker compose down -v || true
