name: Release

on:
  push:
    branches: [main]

# Only one release runs at a time. If a newer commit arrives while a release
# is in progress, the current run finishes — not cancelled — so the build, push
# and tag always complete cleanly. The next queued run will then compute the
# version from the commits that arrived in the meantime.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is computed in the `Compute image name` step below.
  # GHCR rejects repo URLs with uppercase letters, but `github.repository`
  # preserves casing (here: HectorIFC/nlp-kotlin-playground), so we lowercase
  # it once and reuse the result.

jobs:
  release:
    name: Version, Tag & Publish Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history required for conventional commits parsing
          # persist-credentials is intentionally left at the default: the version
          # bump push to main (later in this job) reuses the checkout-installed
          # GITHUB_TOKEN. The token is already scoped via the workflow-level
          # `permissions:` block above (contents: write, packages: write).

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Compute image name (GHCR-safe lowercase)
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Computes the next SemVer from conventional commits since the last tag.
      #
      # Bump rules (squash-merge PR title as conventional commit):
      #   feat!: / BREAKING CHANGE: → major  (0.1.0 → 1.0.0)
      #   feat:                     → minor  (0.0.1 → 0.1.0)
      #   fix: / build: / chore:    → patch  (0.1.0 → 0.1.1)
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: patch
          tag_prefix: v

      - name: Print version decision
        run: |
          echo "Previous tag : ${{ steps.tag.outputs.previous_tag }}"
          echo "New version  : ${{ steps.tag.outputs.new_version }}"
          echo "New tag      : ${{ steps.tag.outputs.new_tag }}"
          echo "Bump type    : ${{ steps.tag.outputs.release_type }}"

      # Single decision step: should we publish?
      # An `exit 0` inside a step's `run:` only succeeds that step — it does NOT
      # short-circuit the rest of the job. So we set a `publish` output here
      # and `if:` every downstream step on it. (Also serves as a safety net for
      # the race where two runs computed the same version before either tagged.)
      - name: Decide whether to publish
        id: gate
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"
          PREV="${{ steps.tag.outputs.previous_tag }}"
          if [ "$TAG" = "$PREV" ]; then
            echo "No releasable commits since last tag — skipping release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git tag --list | grep -qx "$TAG"; then
            echo "Tag $TAG already exists — this version was already released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist yet — proceeding with release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The action is the single source of truth for the version.
      # All version references across the repo are updated atomically here.
      # The version bump commit is pushed to main only AFTER build and publish
      # succeed, so main is never left in a bumped-but-unreleased state.
      # [skip ci] in the commit message prevents this push from triggering
      # another release run — the actual loop-prevention mechanism.
      - name: Update version in all files
        if: steps.gate.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.tag.outputs.new_version }}"
          TAG="${{ steps.tag.outputs.new_tag }}"

          # Gradle build configuration
          sed -i -E "s/^version=.*/version=${VERSION}/" gradle.properties

          # Dockerfile OCI image version label
          sed -i -E "s/(org\.opencontainers\.image\.version=\")[^\"]*/\1${VERSION}/" Dockerfile

          # README — docker pull / version badge mentions
          sed -i -E "s/(ghcr\.io\/hectorifc\/nlp-kotlin-playground:)v[0-9]+\.[0-9]+\.[0-9]+/\1${TAG}/g" README.md
          sed -i -E "s/(version-)v?[0-9]+\.[0-9]+\.[0-9]+/\1${TAG}/g" README.md || true

          # GitHub Pages landing — hero badge, quick start and footer version
          # strings. The page intentionally contains no other vX.Y.Z patterns.
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/${TAG}/g" docs/index.html

          echo "All version references updated to ${TAG} / ${VERSION}"

      - name: Stage version bump commit (local only)
        if: steps.gate.outputs.publish == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties Dockerfile README.md docs/index.html
          if git diff --cached --quiet; then
            echo "No file changes — nothing to commit."
          else
            git commit -m "chore: release ${{ steps.tag.outputs.new_tag }} [skip ci]"
            echo "Version bump committed locally."
          fi

      - name: Build & test
        if: steps.gate.outputs.publish == 'true'
        run: ./gradlew build

      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.publish == 'true'

      - name: Log in to GHCR
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.tag.outputs.new_tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.new_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push only after build and publish succeed. [skip ci] in the commit
      # message prevents this push from triggering a new release workflow run.
      - name: Push version bump to main
        if: steps.gate.outputs.publish == 'true'
        run: |
          if ! git diff --quiet HEAD origin/main; then
            git push origin main
            echo "Version bump pushed to main."
          else
            echo "Nothing to push."
          fi

      - name: Create git tag
        if: steps.gate.outputs.publish == 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag.outputs.new_version }}
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.gate.outputs.publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: |
            Docker image:
            - `${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.tag.outputs.new_tag }}`
            - `${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest`

            ${{ steps.tag.outputs.changelog }}
          generateReleaseNotes: false
          makeLatest: true
