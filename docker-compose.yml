services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nlp-kotlin-playground:local
    container_name: nlp-kotlin-playground
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=playground
      - MINIO_SECRET_KEY=playground123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - SQLITE_PATH=/data/playground.db
      - CONSUMER_CONCURRENCY=2
    volumes:
      - sqlite-data:/data
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: nlp-playground-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      - MINIO_ROOT_USER=playground
      - MINIO_ROOT_PASSWORD=playground123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot init: creates the two buckets the app needs, then exits.
  # `depends_on: service_completed_successfully` on the app guarantees this ran.
  minio-init:
    image: minio/mc:latest
    container_name: nlp-playground-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 playground playground123 &&
        mc mb --ignore-existing local/corpus-uploads &&
        mc mb --ignore-existing local/trained-models &&
        mc ilm rule add --expire-days 1 local/corpus-uploads &&
        mc ilm rule add --expire-days 1 local/trained-models

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nlp-playground-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sqlite-data:
  minio-data:
