<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13141f"/>
      <stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="embed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2"/>

  <!-- Tessera (indigo): the token block -->
  <rect x="20" y="38" width="34" height="52" rx="8" fill="url(#token)"/>

  <!-- The queue: corpus flows from token to embeddings -->
  <circle cx="63" cy="56" r="3" fill="#94a3b8" opacity="0.85"/>
  <circle cx="63" cy="68" r="3" fill="#94a3b8" opacity="0.55"/>
  <circle cx="63" cy="80" r="3" fill="#94a3b8" opacity="0.3"/>

  <!-- Mosaic (orange): embedding cells, descending to suggest vectors -->
  <rect x="72" y="38" width="11" height="52" rx="5" fill="url(#embed)"/>
  <rect x="87" y="51" width="11" height="39" rx="5" fill="url(#embed)" opacity="0.72"/>
  <rect x="102" y="64" width="11" height="26" rx="5" fill="url(#embed)" opacity="0.46"/>
</svg>
